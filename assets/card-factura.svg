<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="Factura sola: punto de venta con facturación electrónica. Demo en vivo.">
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#fff" fill-opacity="0.06"/></pattern>
    <radialGradient id="glow" cx="0.8" cy="0.1" r="0.8"><stop offset="0" stop-color="#22c55e" stop-opacity="0.16"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="0.5" y="0.5" width="599" height="399" rx="20" fill="#0c0c0f" stroke="#27272a"/>
  <rect x="16" y="16" width="568" height="200" rx="12" fill="#131316" stroke="#1f1f23"/>
  <rect x="16" y="16" width="568" height="200" rx="12" fill="url(#dots)"/>
  <rect x="16" y="16" width="568" height="200" rx="12" fill="url(#glow)"/>
  <g font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
    <rect x="32" y="32" width="128" height="26" rx="13" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.45"/>
    <circle cx="46" cy="45" r="3.5" fill="#4ade80"/>
    <text x="56" y="49.5" font-size="11" font-weight="700" letter-spacing="1.2" fill="#4ade80">DEMO EN VIVO</text>
    <text x="556" y="52" font-size="20" fill="#71717a" text-anchor="middle">↗</text>

    <rect x="56" y="70" width="230" height="132" rx="8" fill="#18181b" stroke="#27272a"/>
    <text x="72" y="94" font-size="13" font-weight="600" fill="#fafafa">Venta #1042</text>
    <g font-size="12" fill="#a1a1aa">
      <text x="72" y="118">Martillo 16 oz</text><text x="270" y="118" text-anchor="end">12.50</text>
      <text x="72" y="138">Tornillos x100</text><text x="270" y="138" text-anchor="end">6.80</text>
      <text x="72" y="158">Cinta métrica</text><text x="270" y="158" text-anchor="end">9.75</text>
    </g>
    <rect x="72" y="168" width="198" height="1" fill="#27272a"/>
    <text x="72" y="190" font-size="13" font-weight="600" fill="#fafafa">Total</text>
    <text x="270" y="190" font-size="13" font-weight="600" fill="#fafafa" text-anchor="end">B/. 29.05</text>

    <rect x="310" y="78" width="250" height="36" rx="8" fill="#22c55e" fill-opacity="0.1" stroke="#22c55e" stroke-opacity="0.35"/>
    <path d="M326 96l5 5 9-10" fill="none" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="350" y="101" font-size="13" font-weight="600" fill="#bbf7d0">Factura electrónica emitida</text>
    <text x="310" y="148" font-size="12" fill="#a1a1aa">Tope del facturador gratuito (DGI)</text>
    <rect x="310" y="158" width="250" height="8" rx="4" fill="#27272a"/>
    <rect x="310" y="158" width="180" height="8" rx="4" fill="#f59e0b"/>
    <text x="310" y="188" font-size="12" fill="#71717a">72 % usado · aviso automático</text>

    <text x="32" y="262" font-size="26" font-weight="700" letter-spacing="-0.5" fill="#fafafa">Factura sola</text>
    <g font-size="16" fill="#a1a1aa">
      <text x="32" y="294">Punto de venta que factura al cobrar (PAC simulado) y</text>
      <text x="32" y="318">avisa antes de pasar el tope del facturador gratuito.</text>
    </g>
  </g>
  <g font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="13" fill="#d4d4d8" text-anchor="middle">
    <rect x="32" y="342" width="56" height="28" rx="6" fill="#18181b" stroke="#27272a"/><text x="60" y="360">HTML</text>
    <rect x="96" y="342" width="50" height="28" rx="6" fill="#18181b" stroke="#27272a"/><text x="121" y="360">CSS</text>
    <rect x="154" y="342" width="100" height="28" rx="6" fill="#18181b" stroke="#27272a"/><text x="204" y="360">JavaScript</text>
  </g>
</svg>
