<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="Citas por WhatsApp: asistente que agenda y confirma citas. Demo en vivo.">
  <style>
    .pop{animation:pop .5s cubic-bezier(.2,.7,.2,1) both}
    @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
    .up{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
    @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .ping{transform-box:fill-box;transform-origin:center;animation:ping 2s cubic-bezier(0,0,.2,1) infinite}
    @keyframes ping{0%{transform:scale(1);opacity:.8}80%,100%{transform:scale(3);opacity:0}}
    .draw{stroke-dasharray:21;animation:draw .6s ease-out 1.3s both}
    @keyframes draw{from{stroke-dashoffset:21}to{stroke-dashoffset:0}}
    .fill{transform-box:fill-box;transform-origin:left center;animation:fill 5s cubic-bezier(.4,0,.2,1) 1.6s infinite both}
    @keyframes fill{0%{transform:scaleX(0);opacity:1}40%{transform:scaleX(1)}85%{transform:scaleX(1);opacity:1}95%,100%{transform:scaleX(1);opacity:0}}
    .glow{animation:glow 2.6s ease-in-out infinite}
    @keyframes glow{0%,100%{stroke-opacity:.35}50%{stroke-opacity:.9}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#fff" fill-opacity="0.06"/></pattern>
    <radialGradient id="glowbg" cx="0.8" cy="0.1" r="0.8"><stop offset="0" stop-color="#22c55e" stop-opacity="0.16"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="0.5" y="0.5" width="599" height="399" rx="20" fill="#0c0c0f" stroke="#27272a"/>
  <rect x="16" y="16" width="568" height="200" rx="12" fill="#131316" stroke="#1f1f23"/>
  <rect x="16" y="16" width="568" height="200" rx="12" fill="url(#dots)"/>
  <rect x="16" y="16" width="568" height="200" rx="12" fill="url(#glowbg)"/>
  <g font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
    <rect x="32" y="32" width="128" height="26" rx="13" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.45"/>
    <circle class="ping" cx="46" cy="45" r="3.5" fill="#4ade80"/>
    <circle cx="46" cy="45" r="3.5" fill="#4ade80"/>
    <text x="56" y="49.5" font-size="11" font-weight="700" letter-spacing="1.2" fill="#4ade80">DEMO EN VIVO</text>
    <text x="556" y="52" font-size="20" fill="#71717a" text-anchor="middle">↗</text>

    <g class="pop" style="animation-delay:.2s">
      <rect x="56" y="70" width="240" height="34" rx="10" fill="#18181b" stroke="#27272a"/>
      <text x="70" y="92" font-size="12" fill="#d4d4d8">Quiero una cita de fisio el martes</text>
    </g>
    <g class="pop" style="animation-delay:.9s">
      <rect x="236" y="112" width="270" height="34" rx="10" fill="#22c55e" fill-opacity="0.14" stroke="#22c55e" stroke-opacity="0.4"/>
      <text x="250" y="134" font-size="12" fill="#bbf7d0">Martes 10:30 con Dra. Ríos. ¿Confirma?</text>
    </g>
    <g class="pop" style="animation-delay:1.6s">
      <rect x="56" y="154" width="70" height="34" rx="10" fill="#18181b" stroke="#27272a"/>
      <text x="70" y="176" font-size="12" fill="#d4d4d8">Sí, listo</text>
    </g>
    <g class="up" style="animation-delay:2.2s">
      <rect class="glow" x="330" y="160" width="230" height="36" rx="8" fill="#22c55e" fill-opacity="0.1" stroke="#22c55e" stroke-opacity="0.35"/>
      <path class="draw" d="M346 178l5 5 9-10" fill="none" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="370" y="183" font-size="13" font-weight="600" fill="#bbf7d0">Cita en el panel · recordatorio</text>
    </g>
    <text x="32" y="262" font-size="26" font-weight="700" letter-spacing="-0.5" fill="#fafafa">Citas por WhatsApp</text>
    <g font-size="16" fill="#a1a1aa">
      <text x="32" y="294">Un asistente agenda, confirma y recuerda citas; la</text>
      <text x="32" y="318">clínica lo ve todo en un panel en vivo.</text>
    </g>
  </g>
  <g font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="13" fill="#d4d4d8" text-anchor="middle">
    <rect x="32" y="342" width="56" height="28" rx="6" fill="#18181b" stroke="#27272a"/><text x="60" y="360">HTML</text>
    <rect x="96" y="342" width="50" height="28" rx="6" fill="#18181b" stroke="#27272a"/><text x="121" y="360">CSS</text>
    <rect x="154" y="342" width="100" height="28" rx="6" fill="#18181b" stroke="#27272a"/><text x="204" y="360">JavaScript</text>
  </g>
</svg>
