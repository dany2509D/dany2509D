<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-label="Forma de trabajo: entender, diseñar, entregar, verificar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1222"/>
      <stop offset="1" stop-color="#111c38"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="188" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>
  <rect x="150" y="68" width="900" height="3" rx="1.5" fill="url(#line)" fill-opacity="0.6"/>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <g>
      <circle cx="150" cy="70" r="26" fill="#0b1222" stroke="#38bdf8" stroke-width="2"/>
      <text x="150" y="77" font-size="20" font-weight="700" fill="#7dd3fc">1</text>
      <text x="150" y="128" font-size="20" font-weight="700" fill="#f8fafc">Entender</text>
      <text x="150" y="154" font-size="15" fill="#94a3b8">el proceso del negocio</text>
    </g>
    <g>
      <circle cx="450" cy="70" r="26" fill="#0b1222" stroke="#60a5fa" stroke-width="2"/>
      <text x="450" y="77" font-size="20" font-weight="700" fill="#93c5fd">2</text>
      <text x="450" y="128" font-size="20" font-weight="700" fill="#f8fafc">Diseñar</text>
      <text x="450" y="154" font-size="15" fill="#94a3b8">especificación y plan por escrito</text>
    </g>
    <g>
      <circle cx="750" cy="70" r="26" fill="#0b1222" stroke="#818cf8" stroke-width="2"/>
      <text x="750" y="77" font-size="20" font-weight="700" fill="#a5b4fc">3</text>
      <text x="750" y="128" font-size="20" font-weight="700" fill="#f8fafc">Entregar</text>
      <text x="750" y="154" font-size="15" fill="#94a3b8">versiones funcionales por etapas</text>
    </g>
    <g>
      <circle cx="1050" cy="70" r="26" fill="#0b1222" stroke="#a78bfa" stroke-width="2"/>
      <text x="1050" y="77" font-size="20" font-weight="700" fill="#c4b5fd">4</text>
      <text x="1050" y="128" font-size="20" font-weight="700" fill="#f8fafc">Verificar</text>
      <text x="1050" y="154" font-size="15" fill="#94a3b8">antes de dar algo por terminado</text>
    </g>
  </g>
</svg>
