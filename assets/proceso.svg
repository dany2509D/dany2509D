<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-label="Cómo trabajo: 01 Entender, 02 Diseñar, 03 Entregar, 04 Verificar">
  <rect x="0.5" y="0.5" width="1199" height="209" rx="20" fill="#0c0c0f" stroke="#27272a"/>
  <g fill="#27272a">
    <rect x="300" y="40" width="1" height="130"/>
    <rect x="600" y="40" width="1" height="130"/>
    <rect x="900" y="40" width="1" height="130"/>
  </g>
  <g font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="14" font-weight="600">
    <text x="48" y="64" fill="#38bdf8">01</text>
    <text x="348" y="64" fill="#60a5fa">02</text>
    <text x="648" y="64" fill="#818cf8">03</text>
    <text x="948" y="64" fill="#a78bfa">04</text>
  </g>
  <g font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
    <g font-size="22" font-weight="700" letter-spacing="-0.3" fill="#fafafa">
      <text x="48" y="106">Entender</text>
      <text x="348" y="106">Diseñar</text>
      <text x="648" y="106">Entregar</text>
      <text x="948" y="106">Verificar</text>
    </g>
    <g font-size="15" fill="#a1a1aa">
      <text x="48" y="138">Cómo opera el negocio hoy</text>
