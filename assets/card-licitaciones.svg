<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="Gestión de licitaciones. Demo en vivo.">
  <style>
    .up{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
    @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .ping{transform-box:fill-box;transform-origin:center;animation:ping 2s cubic-bezier(0,0,.2,1) infinite}
    @keyframes ping{0%{transform:scale(1);opacity:.8}80%,100%{transform:scale(3);opacity:0}}
    .fill{transform-box:fill-box;transform-origin:left center;animation:fill 5s cubic-bezier(.4,0,.2,1) .8s infinite both}
    @keyframes fill{0%{transform:scaleX(0);opacity:1}45%{transform:scaleX(1)}85%{transform:scaleX(1);opacity:1}95%,100%{transform:scaleX(1);opacity:0}}
    .glow{animation:glow 2.2s ease-in-out infinite}
    @keyframes glow{0%,100%{stroke-opacity:1}50%{stroke-opacity:.25}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#fff" fill-opacity="0.06"/></pattern>
    <radialGradient id="glowbg" cx="0.8" cy="0.1" r="0.8"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.16"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="599" height="399" rx="20" fill="#0c0c0f" stroke="#27272a"/>
  <rect x="16" y="16" width="568" height="200" rx="12" fill="#131316" stroke="#1f1f23"/>
  <rect x="16" y="16" width="568" height="200" rx="12" fill="url(#dots)"/>
  <rect x="16" y="16" width="568" height="200" rx="12" fill="url(#glowbg)"/>
  <g font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
    <rect x="32" y="32" width="128" height="26" rx="13" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.45"/>
    <circle class="ping" cx="46" cy="45" r="3.5" fill="#4ade80"/>
    <circle cx="46" cy="45" r="3.5" fill="#4ade80"/>
    <text x="56" y="49.5" font-size="11" font-weight="700" letter-spacing="1.2" fill="#4ade80">DEMO EN VIVO</text>
    <text x="556" y="52" font-size="20" fill="#71717a" text-anchor="middle">↗</text>

    <text class="up" x="44" y="80" font-size="12" fill="#71717a">LIC-0187 · Suministro de equipos</text>
    <g font-size="12" font-weight="600" text-anchor="middle">
      <g class="up" style="animation-delay:.1s"><rect x="44" y="92" width="96" height="32" rx="8" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.4"/><text x="92" y="112" fill="#7dd3fc">Borrador</text></g>
      <g class="up" style="animation-delay:.2s"><rect x="148" y="92" width="96" height="32" rx="8" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.4"/><text x="196" y="112" fill="#7dd3fc">Activa</text></g>
      <g class="up" style="animation-delay:.3s"><rect x="252" y="92" width="96" height="32" rx="8" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.4"/><text x="300" y="112" fill="#7dd3fc">Finalizada</text></g>
      <g class="up" style="animation-delay:.4s"><rect class="glow" x="356" y="92" width="96" height="32" rx="8" fill="#18181b" stroke="#38bdf8" stroke-width="1.5"/><text x="404" y="112" fill="#fafafa">Por cobrar</text></g>
      <g class="up" style="animation-delay:.5s"><rect x="460" y="92" width="96" height="32" rx="8" fill="#18181b" stroke="#27272a"/><text x="508" y="112" fill="#71717a">Cobrada</text></g>
    </g>
    <rect x="44" y="134" width="512" height="2" rx="1" fill="#27272a"/>
    <rect class="fill" x="44" y="134" width="360" height="2" rx="1" fill="url(#bar)"/>

    <g class="up" style="animation-delay:.7s">
      <rect x="44" y="148" width="300" height="40" rx="8" fill="#18181b" stroke="#27272a"/>
      <circle class="ping" cx="62" cy="168" r="4" fill="#f59e0b"/>
      <circle cx="62" cy="168" r="4" fill="#f59e0b"/>
      <text x="74" y="173" font-size="13" fill="#d4d4d8">Recordatorio · vence en 48 h</text>
    </g>
    <g class="up" style="animation-delay:.85s">
      <rect x="356" y="148" width="200" height="40" rx="8" fill="#18181b" stroke="#27272a"/>
      <circle cx="374" cy="168" r="4" fill="#22c55e"/>
      <text x="386" y="173" font-size="13" fill="#d4d4d8">Correo con propuesta</text>
    </g>

    <text x="32" y="262" font-size="26" font-weight="700" letter-spacing="-0.5" fill="#fafafa">Gestión de licitaciones</text>
    <g font-size="16" fill="#a1a1aa">
      <text x="32" y="294">Del borrador al cobro: envío por correo, vencimiento y</text>
      <text x="32" y="318">recordatorios automáticos. Roles, JWT y tareas programadas.</text>
    </g>
  </g>
  <g font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="13" fill="#d4d4d8" text-anchor="middle">
    <rect x="32" y="342" width="78" height="28" rx="6" fill="#18181b" stroke="#27272a"/><text x="71" y="360">Next.js</text>
    <rect x="118" y="342" width="100" height="28" rx="6" fill="#18181b" stroke="#27272a"/><text x="168" y="360">TypeScript</text>
    <rect x="226" y="342" width="70" height="28" rx="6" fill="#18181b" stroke="#27272a"/><text x="261" y="360">Prisma</text>
    <rect x="304" y="342" width="100" height="28" rx="6" fill="#18181b" stroke="#27272a"/><text x="354" y="360">PostgreSQL</text>
  </g>
</svg>
