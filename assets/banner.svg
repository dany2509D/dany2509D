  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>

  <text x="80" y="92" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="3" fill="#38bdf8">SOFTWARE A LA MEDIDA · PANAMÁ</text>
  <text x="80" y="158" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="60" font-weight="700" fill="#f8fafc">Daniel Saez</text>
  <rect x="80" y="178" width="72" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="80" y="222" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#cbd5e1">Desarrollador de aplicaciones Jr</text>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#cbd5e1" text-anchor="middle">
    <rect x="80" y="246" width="122" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
