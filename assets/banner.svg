    <rect x="335" y="246" width="100" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="385" y="267">Reservas</text>
    <rect x="445" y="246" width="122" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="506" y="267">IA aplicada</text>
  </g>

  <g transform="translate(760 56)">
    <rect width="370" height="210" rx="14" fill="#0b1222" stroke="#ffffff" stroke-opacity="0.1"/>
    <path d="M0 14a14 14 0 0 1 14-14h342a14 14 0 0 1 14 14v22H0z" fill="#ffffff" fill-opacity="0.04"/>
    <circle cx="22" cy="18" r="5" fill="#f87171"/>
    <circle cx="40" cy="18" r="5" fill="#fbbf24"/>
    <circle cx="58" cy="18" r="5" fill="#34d399"/>
    <text x="185" y="23" text-anchor="middle" font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="12" fill="#64748b">perfil.ts</text>
    <g font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="14" fill="#cbd5e1">
      <text x="22" y="66"><tspan fill="#c084fc">const</tspan> dev = {</text>
      <text x="46" y="92"><tspan fill="#93c5fd">nombre</tspan>: <tspan fill="#86efac">"Daniel Saez"</tspan>,</text>
      <text x="46" y="118"><tspan fill="#93c5fd">rol</tspan>: <tspan fill="#86efac">"Desarrollador Jr"</tspan>,</text>
