<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="Tienda con inventario automático. Demo en vivo.">
  <style>
    .up{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
    @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .ping{transform-box:fill-box;transform-origin:center;animation:ping 2s cubic-bezier(0,0,.2,1) infinite}
    @keyframes ping{0%{transform:scale(1);opacity:.8}80%,100%{transform:scale(3);opacity:0}}
    .sell{transform-box:fill-box;transform-origin:left center;animation:sell 4s ease-in-out infinite}
    @keyframes sell{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.86)}}
    .blink{animation:blink 1.6s ease-in-out infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
    .glow{animation:glow 2.6s ease-in-out infinite}
    @keyframes glow{0%,100%{stroke-opacity:.3}50%{stroke-opacity:.95}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#fff" fill-opacity="0.06"/></pattern>
    <radialGradient id="glowbg" cx="0.8" cy="0.1" r="0.8"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.16"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="0.5" y="0.5" width="599" height="399" rx="20" fill="#0c0c0f" stroke="#27272a"/>
  <rect x="16" y="16" width="568" height="200" rx="12" fill="#131316" stroke="#1f1f23"/>
  <rect x="16" y="16" width="568" height="200" rx="12" fill="url(#dots)"/>
  <rect x="16" y="16" width="568" height="200" rx="12" fill="url(#glowbg)"/>
  <g font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
    <rect x="32" y="32" width="128" height="26" rx="13" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.45"/>
    <circle cx="46" cy="45" r="3.5" fill="#4ade80"/>
    <text x="56" y="49.5" font-size="11" font-weight="700" letter-spacing="1.2" fill="#4ade80">DEMO EN VIVO</text>

    <g font-size="12">
      <g class="up" style="animation-delay:.1s">
        <text x="44" y="92" fill="#d4d4d8">Eau de parfum 100 ml</text><text x="360" y="92" fill="#a1a1aa" text-anchor="end">42 u.</text>
        <rect x="44" y="100" width="316" height="8" rx="4" fill="#27272a"/><rect class="sell" x="44" y="100" width="220" height="8" rx="4" fill="#a78bfa"/>
      </g>
      <g class="up" style="animation-delay:.25s">
        <text x="44" y="136" fill="#d4d4d8">Body mist 250 ml</text><text x="360" y="136" fill="#a1a1aa" text-anchor="end">24 u.</text>
        <rect x="44" y="144" width="316" height="8" rx="4" fill="#27272a"/><rect class="sell" style="animation-delay:1.3s" x="44" y="144" width="126" height="8" rx="4" fill="#a78bfa"/>
      </g>
      <g class="up" style="animation-delay:.4s">
        <text x="44" y="180" fill="#d4d4d8">Set de regalo</text><text class="blink" x="360" y="180" fill="#fca5a5" text-anchor="end">3 u. · mínimo</text>
        <rect x="44" y="188" width="316" height="8" rx="4" fill="#27272a"/><rect class="blink" x="44" y="188" width="24" height="8" rx="4" fill="#ef4444"/>
      </g>
    </g>

    <g class="up" style="animation-delay:.6s">
      <rect class="glow" x="384" y="74" width="176" height="78" rx="8" fill="#a78bfa" fill-opacity="0.1" stroke="#a78bfa" stroke-opacity="0.4"/>
      <text x="398" y="97" font-size="13" font-weight="600" fill="#ddd6fe">Orden de compra</text>
      <text x="398" y="116" font-size="11" fill="#a1a1aa">generada automáticamente</text>
      <text x="398" y="139" font-size="12" fill="#d4d4d8">Set de regalo · 20 u.</text>
    </g>
    <g class="up" style="animation-delay:.8s">
      <rect x="384" y="162" width="176" height="34" rx="8" fill="#18181b" stroke="#27272a"/>
      <circle class="ping" cx="400" cy="179" r="4" fill="#22c55e"/>
      <circle cx="400" cy="179" r="4" fill="#22c55e"/>
      <text x="412" y="183" font-size="12" fill="#d4d4d8">WooCommerce sincronizado</text>
    </g>

    <text x="32" y="262" font-size="26" font-weight="700" letter-spacing="-0.5" fill="#fafafa">Tienda con inventario automático</text>
    <g font-size="16" fill="#a1a1aa">
      <text x="32" y="294">Tienda en línea y punto de venta conectados: el stock baja</text>
      <text x="32" y="318">en cada venta y la orden de compra se genera sola.</text>
    </g>
  </g>
  <g font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="13" fill="#d4d4d8" text-anchor="middle">
    <rect x="32" y="342" width="78" height="28" rx="6" fill="#18181b" stroke="#27272a"/><text x="71" y="360">Node.js</text>
    <rect x="118" y="342" width="70" height="28" rx="6" fill="#18181b" stroke="#27272a"/><text x="153" y="360">SQLite</text>
    <rect x="196" y="342" width="108" height="28" rx="6" fill="#18181b" stroke="#27272a"/><text x="250" y="360">WooCommerce</text>
  </g>
</svg>
