<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-label="BarrioPizzaAI: código público">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1222"/>
      <stop offset="1" stop-color="#111c38"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="598" height="278" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>
  <rect x="1" y="1" width="6" height="278" rx="3" fill="#38bdf8"/>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="32" y="30" width="170" height="28" rx="14" fill="#38bdf8" fill-opacity="0.14" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="117" y="49" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.5" fill="#7dd3fc">CÓDIGO PÚBLICO ↗</text>
    <text x="32" y="106" font-size="30" font-weight="700" fill="#f8fafc">BarrioPizzaAI</text>
    <g font-size="17" fill="#94a3b8">
