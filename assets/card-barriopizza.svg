    </g>
  </g>
  <g font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="14" fill="#cbd5e1" text-anchor="middle">
    <rect x="32" y="222" width="74" height="30" rx="8" fill="#ffffff" fill-opacity="0.06"/>
    <text x="69" y="242">Python</text>
    <rect x="116" y="222" width="100" height="30" rx="8" fill="#ffffff" fill-opacity="0.06"/>
    <text x="166" y="242">Streamlit</text>
    <rect x="226" y="222" width="74" height="30" rx="8" fill="#ffffff" fill-opacity="0.06"/>
    <text x="263" y="242">pandas</text>
    <rect x="310" y="222" width="74" height="30" rx="8" fill="#ffffff" fill-opacity="0.06"/>
    <text x="347" y="242">Plotly</text>
