<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="BarrioPizzaAI: panel de inventario con IA. Código público.">
  <style>
    .up{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
    @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .ping{transform-box:fill-box;transform-origin:center;animation:ping 2s cubic-bezier(0,0,.2,1) infinite}
    @keyframes ping{0%{transform:scale(1);opacity:.8}80%,100%{transform:scale(3);opacity:0}}
    .line{stroke-dasharray:195;animation:line 7s cubic-bezier(.4,0,.2,1) infinite both}
    @keyframes line{0%{stroke-dashoffset:195;opacity:1}35%{stroke-dashoffset:0}88%{stroke-dashoffset:0;opacity:1}96%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:195;opacity:0}}
    .area{animation:area 7s ease infinite both}
    @keyframes area{0%,20%{opacity:0}40%,88%{opacity:1}96%,100%{opacity:0}}
    .march{animation:march 1.2s linear infinite}
    @keyframes march{to{stroke-dashoffset:-22}}
    .alert{animation:alert 1.8s ease-in-out infinite}
    @keyframes alert{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#fff" fill-opacity="0.06"/></pattern>
    <radialGradient id="glowbg" cx="0.8" cy="0.1" r="0.8"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.14"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
    <linearGradient id="areag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.25"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="599" height="399" rx="20" fill="#0c0c0f" stroke="#27272a"/>
  <rect x="16" y="16" width="568" height="200" rx="12" fill="#131316" stroke="#1f1f23"/>
  <rect x="16" y="16" width="568" height="200" rx="12" fill="url(#dots)"/>
  <rect x="16" y="16" width="568" height="200" rx="12" fill="url(#glowbg)"/>
  <g font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
    <rect x="32" y="32" width="150" height="26" rx="13" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.45"/>
    <circle class="ping" cx="46" cy="45" r="3.5" fill="#7dd3fc"/>
    <circle cx="46" cy="45" r="3.5" fill="#7dd3fc"/>
    <text x="56" y="49.5" font-size="11" font-weight="700" letter-spacing="1.2" fill="#7dd3fc">CÓDIGO PÚBLICO</text>
    <text x="556" y="52" font-size="20" fill="#71717a" text-anchor="middle">↗</text>

    <text x="44" y="84" font-size="12" fill="#71717a">Consumo de queso (kg) · histórico y pronóstico</text>
    <path d="M44 110H372M44 150H372M44 190H372" stroke="#27272a"/>
    <path class="area" d="M60 172L90 162L120 167L150 147L180 152L210 137L240 142V190H60Z" fill="url(#areag)"/>
    <polyline class="line" points="60,172 90,162 120,167 150,147 180,152 210,137 240,142" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline class="march" points="240,142 270,130 300,134 330,120 360,114" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6 5" stroke-linecap="round"/>
    <circle class="area" cx="240" cy="142" r="4" fill="#0c0c0f" stroke="#f59e0b" stroke-width="2"/>
    <text x="300" y="108" font-size="11" fill="#a1a1aa" text-anchor="middle">pronóstico</text>

    <g class="up" style="animation-delay:.3s">
      <rect class="alert" x="396" y="74" width="164" height="58" rx="8" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-opacity="0.4"/>
      <text x="410" y="97" font-size="13" font-weight="600" fill="#fca5a5">Stock bajo</text>
      <text x="410" y="118" font-size="12" fill="#d4d4d8">Mozzarella · 3 días</text>
    </g>
    <g class="up" style="animation-delay:.5s">
      <rect x="396" y="142" width="164" height="58" rx="8" fill="#18181b" stroke="#27272a"/>
      <text x="410" y="165" font-size="13" font-weight="600" fill="#fafafa">Orden semanal</text>
      <text x="410" y="186" font-size="12" fill="#a1a1aa">lista para el proveedor</text>
    </g>

    <text x="32" y="262" font-size="26" font-weight="700" letter-spacing="-0.5" fill="#fafafa">BarrioPizzaAI</text>
    <g font-size="16" fill="#a1a1aa">
      <text x="32" y="294">Inventario de una pizzería: pronóstico de consumo, alertas</text>
      <text x="32" y="318">de stock, orden de compra semanal y asistente con IA.</text>
    </g>
  </g>
  <g font-family="'Cascadia Code', Consolas, 'Courier New', monospace" font-size="13" fill="#d4d4d8" text-anchor="middle">
    <rect x="32" y="342" width="70" height="28" rx="6" fill="#18181b" stroke="#27272a"/><text x="67" y="360">Python</text>
    <rect x="110" y="342" width="92" height="28" rx="6" fill="#18181b" stroke="#27272a"/><text x="156" y="360">Streamlit</text>
    <rect x="210" y="342" width="70" height="28" rx="6" fill="#18181b" stroke="#27272a"/><text x="245" y="360">pandas</text>
    <rect x="288" y="342" width="70" height="28" rx="6" fill="#18181b" stroke="#27272a"/><text x="323" y="360">Plotly</text>
  </g>
</svg>
